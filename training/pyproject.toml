[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fireworks-training-cookbook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fireworks-ai[training]>=1.2.22,<2",
    # Preserve the runtime floors previously supplied by tinker-cookbook.
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "tinker>=0.22.3",
    "tqdm>=4.60.0",
    # transformers 5.10.4 reads torch.float8_e8m0fnu at import time; that
    # dtype lands in torch 2.7.
    "torch>=2.7",
    "datasets>=2.14.0",
    "tiktoken>=0.12.0",
    "numpy>=1.24.0",
    "transformers==5.10.4",
    # Imported directly by utils.tokenizers to read tokenizer declarations
    # before choosing a backend; range matches transformers==5.10.4's own.
    "huggingface-hub>=1.5.0,<2.0",
    "python-dotenv",
    "wandb>=0.28.2",
    "orjson",
    "hydra-core>=1.3,<2",
    "pillow>=12.3.0",
    # datasets/mimo/mcp client and the task bundles' MCP servers are 1.x;
    # 2.x removed FastMCP. Keep in sync with the image pin (mcp==1.30.0).
    "mcp>=1.8,<2",
]

[project.optional-dependencies]
eval = [
    "eval-protocol>=0.3.32",
]
# SDFT (training._vendor.tinker_cookbook_fw) runs on upstream tinker-cookbook
# plus the Fireworks-modified modules vendored there. Only SDFT imports these.
sdft = [
    "chz>=0.4.0",
    "tinker-cookbook==0.5.7",
]
dev = [
    "fireworks-training-cookbook[eval]",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "math-verify",
]

[tool.setuptools]
# This pyproject lives inside the import package so users can install from
# ``cookbook/training``. Keep package paths inside the project root: discovering
# from ``..`` creates unsafe parent paths in the sdist and an empty rebuilt
# wheel. The artifact test guards this explicit list against missing modules.
package-dir = { training = "." }
packages = [
    "training",
    "training._vendor",
    "training._vendor.tinker_cookbook_0_4_3",
    "training._vendor.tinker_cookbook_0_4_3.renderers",
    "training._vendor.tinker_cookbook_0_4_3.supervised",
    "training._vendor.tinker_cookbook_fw",
    "training._vendor.tinker_cookbook_fw.distillation",
    "training._vendor.tinker_cookbook_fw.recipes",
    "training._vendor.tinker_cookbook_fw.recipes.sdft",
    "training._vendor.tinker_cookbook_fw.rl",
    "training._vendor.tinker_cookbook_fw.supervised",
    "training.case-studies.agentic_rl_text2sql",
    "training.case-studies.common",
    "training.case-studies.dpo_style",
    "training.case-studies.embedding_support_search",
    "training.case-studies.grpo_countdown",
    "training.case-studies.multilora_fleet",
    "training.case-studies.reasoning_rl.grpo_math_evaluator",
    "training.case-studies.sft_bfcl_toolcalls",
    "training.dataset_utils",
    "training.examples",
    "training.examples.archive",
    "training.examples.archive.countdown",
    "training.examples.archive.eval_protocol_chat",
    "training.examples.archive.eval_protocol_chat.remote_server",
    "training.examples.archive.single_turn_token_in",
    "training.examples.distillation.gsm8k_privileged",
    "training.examples.distillation.serverless_k3_privileged",
    "training.examples.dpo",
    "training.examples.embedding",
    "training.examples.harbor_rl",
    "training.examples.harbor_rl.harnesses",
    "training.examples.harbor_rl.harnesses.mimoagent",
    "training.examples.harbor_rl.harnesses.mini_swe",
    "training.examples.harbor_rl.harnesses.opencode",
    "training.examples.harbor_rl.harnesses.pi",
    "training.examples.harbor_rl.tasks",
    "training.examples.harbor_rl.tasks.dabstep",
    "training.examples.harbor_rl.tasks.deep_swe",
    "training.examples.harbor_rl.tasks.mimo",
    "training.examples.harbor_rl.tasks.mimo.assets",
    "training.examples.harbor_rl.tasks.mimo.assets.webdev",
    "training.examples.harbor_rl.tasks.mimo.mcp",
    "training.examples.harbor_rl.tasks.mimo.music_scorer",
    "training.examples.harbor_rl.tasks.terminal_bench",
    "training.examples.harbor_rl.tasks.textworld",
    "training.examples.harbor_rl.tito",
    "training.examples.orpo",
    "training.examples.orpo.ifeval",
    "training.examples.rl",
    "training.examples.rl.deepmath",
    "training.examples.rl.experiment",
    "training.examples.rl.experiment.sao",
    "training.examples.rl.frozen_lake",
    "training.examples.rl.multihop_qa",
    "training.examples.rl.visual_toolbench",
    "training.examples.sft",
    "training.examples.tools",
    "training.recipes",
    "training.recipes.experiment",
    "training.renderer",
    "training.renderer.tito",
    "training.renderer.verifier",
    "training.renderer.verifier.utils",
    "training.tests",
    "training.tests.e2e",
    "training.tests.smoke_test",
    "training.tests.unit",
    "training.tito",
    "training.utils",
    "training.utils.distillation",
    "training.utils.rl",
    "training.utils.rl.agent",
    "training.utils.rl.algorithm",
    "training.utils.rl.async_rl",
    "training.utils.rl.rollout",
]

[tool.setuptools.package-data]
"training.examples.sft" = ["text2sql_dataset.jsonl", "food_reasoning.jsonl", "data/support_triage_train.jsonl"]
"training.examples.rl.deepmath" = ["dataset.jsonl"]
"training.examples.rl.frozen_lake" = ["seeds.jsonl", "assets/img/*.png"]
"training.examples.embedding" = ["retrieval_pairs.jsonl"]
"training.examples.harbor_rl.tasks.mimo.music_scorer" = ["baselines/ref_full4k.json"]
"training.examples.distillation.serverless_k3_privileged" = ["data/gsm8k_privileged.jsonl", "data/gsm8k_200.jsonl"]
"training.examples.archive.countdown" = ["data/countdown_train.jsonl"]
"training.examples.archive.eval_protocol_chat" = ["train.jsonl"]
"training.tests" = ["_encoding_dsv41_oracle.LICENSE"]
"training._vendor.tinker_cookbook_0_4_3" = ["LICENSE"]
"training._vendor.tinker_cookbook_fw" = ["LICENSE"]

[tool.uv]
# tinker-cookbook (the sdft extra) declares transformers<=5.5.4; keep this
# project's transformers pin authoritative.
override-dependencies = [
    "transformers==5.10.4",
]

[tool.pytest.ini_options]
testpaths = ["training/tests"]
markers = [
    "e2e: tests that hit remote Fireworks infrastructure",
    "timeout: per-test timeout budget",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Vendored MiMo graders. The music scorer and webdev shot script are copied
# unchanged so scores stay comparable with MiMo's published runs.
"examples/harbor_rl/tasks/mimo/music_scorer/**" = ["E731"]
"examples/harbor_rl/tasks/mimo/assets/**" = ["E731"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]

[tool.coverage.report]
show_missing = true
skip_covered = true
include = [
    "recipes/*.py",
    "examples/*/train_*.py",
    "examples/*/prepare_data.py",
]
omit = [
    "*/__init__.py",
]
